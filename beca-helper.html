<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>beca staging helper (temporary)</title>
<style>
html,body{margin:0;height:100%;background:#141414;overflow:hidden}
#ph{width:420px;max-width:100vw;height:100vh;margin:0 auto;background:#000}
#f{border:0;width:100%;height:100%;display:block}
#st{position:fixed;left:6px;top:6px;z-index:9;width:340px;max-height:96vh;overflow:auto;background:rgba(0,0,0,.85);color:#3f3;font:11px/1.4 monospace;white-space:pre-wrap;word-break:break-word;padding:6px;margin:0}
</style>
</head>
<body>
<div id="ph"><iframe id="f" src="beca-run.html"></iframe></div>
<pre id="st">boot...</pre>
<script>
var q=new URLSearchParams(location.search);
var scene=q.get('scene')||'crash';
var st=document.getElementById('st');
var F=document.getElementById('f');
var B=null,log=[],phase='start',tmpl=null,target=null,attempts=0,playT0=0,seenCols=[],lastHb=0,rideT0=0,placedT0=0,lastSeenStr='';
function say(s){log.push(s);if(log.length>80)log.shift();st.textContent='['+scene+']\n'+log.join('\n');}
function done(s){say('DONE '+s);phase='done';}
function trains(){return B.S.entities.filter(function(e){return e.kind==='train';});}
function clearHazards(keep){var es=B.S.entities,pl=B.S.lane;for(var i=es.length-1;i>=0;i--){var e=es[i];if(e.kind==='lowbar'||e.kind==='over'){es.splice(i,1);continue;}if(e!==keep&&e.lane===pl&&e.z<70&&e.kind==='train')es.splice(i,1);}}
function steerTo(lane){var g=0;while(B.S.lane!==lane&&g++<5){if(B.S.lane<lane)B.moveRight();else B.moveLeft();}}
function laneSafe(lane){var es=B.S.entities;for(var i=0;i<es.length;i++){var e=es[i];if(e.lane===lane&&e.z<70&&e.z>-10&&(e.kind==='train'||e.kind==='lowbar'||e.kind==='over'))return false;}return true;}
function dodgeLane(){var order=[0,-1,1];for(var i=0;i<order.length;i++){var L=order[i];if(L!==B.S.lane&&laneSafe(L)){steerTo(L);say('dodge to lane '+L);return true;}}return false;}
function gap(){try{var w=B.wolfGap;var v=(typeof w==='function')?w():w;return JSON.stringify(v);}catch(e){return '?';}}
F.addEventListener('load',function(){setTimeout(init,400);});
function init(){
 try{B=F.contentWindow.__becaRun;}catch(e){say('hook ERR '+e);return;}
 if(!B){say('no hook');return;}
 say('hook ok SPAWN_Z='+B.SPAWN_Z);
 say('Skeys='+Object.keys(B.S).join(','));
 try{say('layout='+JSON.stringify(B.layout()));}catch(e){say('layout ERR '+e.message);}
 B.start();B.skipCutscene();
 setInterval(tick,scene==='stairs'?16:50);
}
function tick(){
 if(phase==='done')return;
 try{step();}catch(e){say('ERR '+e.message);}
 var now=Date.now();
 if(B&&B.S&&now-lastHb>3000){lastHb=now;var hz=B.S.entities.filter(function(e){return e.lane===B.S.lane&&(e.kind==='train'||e.kind==='lowbar'||e.kind==='over')&&e.z<120;}).sort(function(a,b){return a.z-b.z;})[0];say('hb mode='+B.S.mode+' score='+B.S.score+' wolfGap='+gap()+' onTrain='+(B.S.onTrain?'Y':'-')+' lane='+B.S.lane+' nearHaz='+(hz?hz.kind+' z='+hz.z.toFixed(0):'none'));}
}
function step(){
 var S=B.S;
 if(phase==='start'){if(S.mode==='playing'){phase='run';playT0=Date.now();say('playing');}return;}
 if(phase==='done')return;
 if(S.mode==='over'&&phase!=='waitover'){
  say('UNEXPECTED OVER score='+S.score+' phase='+phase+' attempts='+attempts);
  var near=S.entities.filter(function(e){return e.z<40&&e.z>-10;}).map(function(e){return e.kind+':'+e.lane+' z='+e.z.toFixed(0);}).join(' | ');
  say('ents near player: '+(near||'none'));
  if(++attempts>3){say('GIVING UP');phase='done';return;}
  B.start();B.skipCutscene();phase='start';tmpl=null;target=null;return;
 }
 if(scene==='crash')return crashStep(S);
 if(scene==='roof')return roofStep(S);
 if(scene==='stairs')return stairsStep(S);
 if(scene==='breather')return breatherStep(S);
}
function placeCrashTrain(S){
 clearHazards(null);
 S.entities.push({kind:'train',lane:0,z:22,len:tmpl.len,color:tmpl.color,ramp:false});
 S.spawnAcc=-1e9;placedT0=Date.now();
 say('placed train lane0 z=22 len='+tmpl.len+' color='+tmpl.color);
 phase='waitover';
}
function crashStep(S){
 if(phase==='run'){
  clearHazards(null);
  var tr=trains();
  if(tr.length){
   var red=null,i;
   for(i=0;i<tr.length;i++){if(/red/i.test(String(tr[i].color)))red=tr[i];}
   var pick=red||(Date.now()-playT0>20000?tr[0]:null);
   if(pick){
    tmpl={len:pick.len,color:pick.color};
    say('template len='+pick.len+' color='+pick.color+' ramp='+pick.ramp+' red='+(!!red));
    placeCrashTrain(S);
   }else{
    for(i=0;i<tr.length;i++){if(seenCols.indexOf(String(tr[i].color))<0)seenCols.push(String(tr[i].color));}
    var ss=seenCols.join(',');
    if(ss!==lastSeenStr){lastSeenStr=ss;say('waiting red... seen colors: '+ss);}
   }
  }
  return;
 }
 if(phase==='waitover'){
  if(S.mode==='over'){
   var t0=trains().filter(function(e){return e.lane===0;}).map(function(e){return 'z='+e.z.toFixed(1)+' len='+e.len+' col='+e.color;}).join(' | ');
   var d=F.contentDocument,nb=d.getElementById('newBest'),ov=d.querySelector('#gameover')||d.querySelector('#over');
   say('OVER score='+S.score+' best='+S.best+' newBest='+S.newBest+' newBestHidden='+(nb?nb.classList.contains('hidden'):'?'));
   say('overlay: '+(ov?ov.innerText.replace(/\s+/g,' ').slice(0,240):'NOT FOUND'));
   say('lane0 trains: '+t0);
   done('crash over');
  }else if(Date.now()-placedT0>4000){
   say('no crash after 4s, re-placing');
   placeCrashTrain(S);
  }
 }
}
function roofStep(S){
 if(phase==='run'){
  if(target&&target.z<0)target=null;
  clearHazards(target);
  if(S.onTrain){rideT0=Date.now();phase='riding';say('onTrain! z='+S.onTrain.z.toFixed(1)+' len='+S.onTrain.len+' col='+S.onTrain.color);return;}
  var inLane=trains().filter(function(e){return e.lane===S.lane&&e.z>=28&&e.z<=60;});
  if(inLane.length){
   inLane.sort(function(a,b){return a.z-b.z;});
   var t=inLane[0];target=t;
   B.jump();say('jump at train z='+t.z.toFixed(1)+' lane='+t.lane+' speed='+S.speed.toFixed(0));phase='jumped';return;
  }
  var close=trains().filter(function(e){return e.lane===S.lane&&e.z<28&&e.z>-5;});
  if(close.length){if(!dodgeLane()){say('no safe lane! close train z='+close[0].z.toFixed(1));}target=null;return;}
  var fut=trains().filter(function(e){return e.z>60&&e.z<160;});
  if(fut.length){fut.sort(function(a,b){return a.z-b.z;});target=fut[0];steerTo(target.lane);}
  return;
 }
 if(phase==='jumped'){
  clearHazards(target);
  if(S.onTrain){rideT0=Date.now();phase='riding';say('onTrain! z='+S.onTrain.z.toFixed(1)+' len='+S.onTrain.len+' col='+S.onTrain.color);return;}
  if(S.jumpT<=0&&target&&target.z<25&&target.z>-5){say('jump did not take, dodging');if(dodgeLane()){phase='run';target=null;}return;}
  if(!target||target.z<-5){phase='run';say('jump missed, retry');}
  return;
 }
 if(phase==='riding'){
  if(!S.onTrain){phase='run';say('fell off / train ended, retry');return;}
  if(Date.now()-rideT0>120){S.mode='paused';say('frozen riding z='+S.onTrain.z.toFixed(1)+' len='+S.onTrain.len);done('roof ride frozen');}
  return;
 }
}
function stairsStep(S){
 if(phase==='run'){
  clearHazards(target);
  var RL=B.layout().RAMP_LEN;
  var cand=trains().filter(function(e){return e.ramp&&e.z>RL-2&&e.z<100;});
  if(cand.length){
   cand.sort(function(a,b){return a.z-b.z;});
   var t=cand[0];target=t;
   steerTo(t.lane);
   if(S.lane===t.lane){
    var foot=t.z-RL,rh=0;
    try{rh=B.rampH();}catch(e){}
    if(foot<=0.5&&foot>=-3){
     S.mode='paused';
     say('frozen footZ='+foot.toFixed(2)+' trainZ='+t.z.toFixed(1)+' len='+t.len+' rampH='+rh.toFixed(2)+' RAMP_LEN='+RL);
     done('stairs frozen footZ='+foot.toFixed(2));
     return;
    }
    if(foot<-3){say('missed window foot='+foot.toFixed(1));}
   }
  }
  return;
 }
}
var bPhase='clear';
function breatherStep(S){
 if(bPhase==='clear'){
  S.entities.length=0;S.spawnAcc=-1e9;bPhase='force';
  say('field cleared, forcing rows');return;
 }
 if(bPhase==='force'){
  B.spawnPattern();
  var row=S.entities.filter(function(e){return Math.abs(e.z-B.SPAWN_Z)<0.6;});
  var nt=row.filter(function(e){return e.kind==='train';}).length;
  say('row#'+S.patterns+' trains='+nt+' prevRowTrains='+S.prevRowTrains+' kinds='+row.map(function(e){return e.kind+':'+e.lane;}).join(','));
  if(nt===2){bPhase='next';}
  return;
 }
 if(bPhase==='next'){
  B.spawnPattern();
  var row2=S.entities.filter(function(e){return Math.abs(e.z-B.SPAWN_Z)<0.6;});
  var nt2=row2.filter(function(e){return e.kind==='train';}).length;
  say('NEXT row#'+S.patterns+' trains='+nt2+' prevRowTrains='+S.prevRowTrains+' kinds='+row2.map(function(e){return e.kind+':'+e.lane;}).join(','));
  S.mode='paused';
  done('breather next-row trains='+nt2+(nt2===0?' CONFIRMED':' FAILED'));
  return;
 }
}
</script>
</body>
</html>
